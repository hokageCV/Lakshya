<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./popup.css">
    <title>Lakshya</title>
</head>
<body>
    <nav>
        <p>LAKSHYA</p>
    </nav>
    <main>
        <section class="popupOption">
            <label class="quote">
                <input type="checkbox" id="quoteCheckbox" class='input-checkbox'>
                Show Quote
            </label>
        </section>
        <section class="popupOption">
            <label class="tasks">
                <input type="checkbox" id="tasksCheckbox" class='input-checkbox'>
                Show Tasks
            </label>
        </section>
        <section class="popupOption">
            <label class="scrollbar">
                <input type="checkbox" id="scrollbarCheckbox" class='input-checkbox'>
                Hide Scrollbar
            </label>
        </section>
        <section class="popupOption">
            <label class="lifetime">
                <input type="checkbox" id="lifetimeCheckbox" class='input-checkbox'>
                Show Lifetime
            </label>
        </section>
        <section class="popupOption title">
            <label>Birth Year</label>
            <input type="number" id="birthYearInput" min="1900">
        </section>
        <section class="popupOption title">
            <label>New Tab Title</label>
            <input type="text" id="titleInput" maxlength="28">
        </section>
    </main>
    <script src="./popup.js" defer></script>
</body>
</html>
